<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Shashank Khatri, Software Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080000"/>
      <stop offset="1" stop-color="#2b0006"/>
    </linearGradient>
    <radialGradient id="flash" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#ff2a2a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff2a2a" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-20%" width="200%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textglow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .bolt { opacity: 0; animation: strike 4s infinite; }
    .b1 { animation-delay: 0s; }
    .b2 { animation-delay: 1.6s; }
    .b3 { animation-delay: 2.8s; }
    .b4 { animation-delay: 0.9s; }
    .sky { opacity: 0; animation: skyflash 4s infinite; }
    .s1 { animation-delay: 0s; }
    .s2 { animation-delay: 1.6s; }
    .s3 { animation-delay: 2.8s; }
    @keyframes strike {
      0%, 100% { opacity: 0; }
      3% { opacity: 1; }
      6% { opacity: 0.25; }
      9% { opacity: 1; }
      16% { opacity: 0; }
    }
    @keyframes skyflash {
      0%, 100% { opacity: 0; }
      3% { opacity: 1; }
      6% { opacity: 0.3; }
      9% { opacity: 0.9; }
      20% { opacity: 0; }
    }
    .name { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 62px; fill: #ffffff; letter-spacing: 1px; }
    .role { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 22px; fill: #ff8a8a; letter-spacing: 6px; }
  </style>

  <rect width="1000" height="260" fill="url(#bg)"/>

  <!-- sky flashes -->
  <rect class="sky s1" width="1000" height="260" fill="url(#flash)"/>
  <rect class="sky s2" width="1000" height="260" fill="url(#flash)"/>
  <rect class="sky s3" width="1000" height="260" fill="url(#flash)"/>

  <!-- bolts: clean single-path strokes, no side branches -->
  <g class="bolt b1" filter="url(#glow)">
    <path d="M172 0 L146 68 L170 76 L124 146 L148 154 L112 260" fill="none" stroke="#ff1f1f" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M172 0 L146 68 L170 76 L124 146 L148 154 L112 260" fill="none" stroke="#ffe5e5" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
  <g class="bolt b2" filter="url(#glow)">
    <path d="M838 0 L864 68 L840 76 L886 146 L862 154 L898 260" fill="none" stroke="#ff1f1f" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M838 0 L864 68 L840 76 L886 146 L862 154 L898 260" fill="none" stroke="#ffe5e5" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
  <g class="bolt b3" filter="url(#glow)">
    <path d="M330 0 L314 52 L332 58 L304 118 L320 124 L296 190" fill="none" stroke="#ff1f1f" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M330 0 L314 52 L332 58 L304 118 L320 124 L296 190" fill="none" stroke="#ffe5e5" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
  <g class="bolt b4" filter="url(#glow)">
    <path d="M690 0 L706 52 L688 58 L716 118 L700 124 L724 190" fill="none" stroke="#ff1f1f" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M690 0 L706 52 L688 58 L716 118 L700 124 L724 190" fill="none" stroke="#ffe5e5" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
  </g>

  <!-- text -->
  <text x="500" y="135" text-anchor="middle" class="name" filter="url(#textglow)">Shashank Khatri</text>
  <text x="500" y="178" text-anchor="middle" class="role">SOFTWARE DEVELOPER</text>
</svg>
